# ============================================================
#  BFF MOVIL - backend dedicado a la app de telefono
# ============================================================
spring.application.name=bff-mobile
server.port=8082

banco.core-api.url=${CORE_API_URL:http://localhost:8080}
# Timeouts mas cortos que el BFF web: en movil vale mas fallar rapido y dejar
# que la app reintente, que dejar una pantalla girando.
banco.core-api.timeout-conexion-ms=1500
banco.core-api.timeout-lectura-ms=3000

# No serializar nulos: en una lista de movimientos cada clave nula repetida
# suma bytes que el telefono paga.
spring.jackson.default-property-inclusion=non_null

server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=512

springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.bank.xyz.bff=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %-28.28logger{0} : %msg%n
