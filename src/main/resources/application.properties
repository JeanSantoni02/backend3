# ============================================================
# CONFIGURACI\u00d3N DE SPRING BATCH - BANCO XYZ
# ============================================================

# ===============================
# CONFIGURACI\u00d3N DE LA BASE DE DATOS (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/bank_legacy_db
spring.datasource.username=postgres
spring.datasource.password=Duocuc
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# CONFIGURACI\u00d3N DE JPA (Hibernate)
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# CONFIGURACI\u00d3N DE SPRING BATCH
# ===============================
# Crear las tablas de metadatos autom\u00e1ticamente
spring.batch.jdbc.initialize-schema=always

# No ejecutar jobs autom\u00e1ticamente al iniciar la app
spring.batch.job.enabled=false

# ===============================
# CONFIGURACI\u00d3N DEL CHUNK
# ===============================
batch.chunk.size=5

# ===============================
# CONFIGURACI\u00d3N DEL LOGGING
# ===============================
logging.level.com.bank.xyz.batch=DEBUG
logging.level.org.springframework.batch=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===============================
# CONFIGURACI\u00d3N DE CARPETAS
# ===============================
# Ruta donde est\u00e1n los archivos CSV
batch.input.path=src/main/resources/data/semana_3/

