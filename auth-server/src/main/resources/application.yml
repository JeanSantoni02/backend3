server:
  port: 9000

spring:
  application:
    name: auth-server

banco:
  oauth2:
    issuer: ${AUTH_ISSUER:http://localhost:9000}
    clientes:
      - id: bff-web
        secreto: ${BFF_WEB_SECRET:secreto-bff-web}
        scopes: cuentas.leer,transacciones.leer
      - id: bff-mobile
        secreto: ${BFF_MOBILE_SECRET:secreto-bff-mobile}
        scopes: cuentas.leer
      - id: bff-atm
        secreto: ${BFF_ATM_SECRET:secreto-bff-atm}
        scopes: cuentas.leer,retiros.escribir
      # servicio-cuentas consulta clientes al abrir una cuenta; no puede modificarlos
      - id: servicio-cuentas
        secreto: ${SERVICIO_CUENTAS_SECRET:secreto-servicio-cuentas}
        scopes: clientes.leer
      # Backoffice de operaciones: el unico cliente que opera los servicios de dominio
      - id: portal-operaciones
        secreto: ${PORTAL_OPERACIONES_SECRET:secreto-portal-operaciones}
        scopes: clientes.leer,clientes.escribir,cuentas.leer,cuentas.escribir,pagos.leer,pagos.escribir

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %-28.28logger{0} : %msg%n"
