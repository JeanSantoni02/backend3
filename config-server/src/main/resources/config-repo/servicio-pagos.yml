spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bank_legacy_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  artemis:
    mode: ${ARTEMIS_MODE:native}
    broker-url: ${ARTEMIS_URL:tcp://localhost:61616}
  jms:
    pub-sub-domain: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_URL:http://localhost:9000}

banco:
  pagos:
    # Desde este monto la operacion se aplica igual, pero dispara una alerta
    umbral-alerta: 1000000
