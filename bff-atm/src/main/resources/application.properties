# ============================================================
#  BFF CAJEROS AUTOMATICOS
# ============================================================
spring.application.name=bff-atm
server.port=8083

banco.core-api.url=${CORE_API_URL:http://localhost:8080}
banco.core-api.timeout-conexion-ms=2000
banco.core-api.timeout-lectura-ms=8000

# Credenciales de los terminales autorizados.
# En produccion saldrian de un gestor de secretos; aqui se dejan como variables
# de entorno con un valor por defecto solo para poder probar en local.
banco.atm.terminales.ATM-001=${ATM_001_KEY:clave-demo-001}
banco.atm.terminales.ATM-002=${ATM_002_KEY:clave-demo-002}

banco.atm.monto-minimo=1000
banco.atm.monto-maximo=200000
banco.atm.denominacion=1000

# No publicar la version del servidor en las respuestas.
server.error.include-message=never
server.error.include-stacktrace=never

springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.bank.xyz.bff=INFO
logging.level.AUDITORIA_ATM=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %-22.22logger{0} : %msg%n
