# ============================================================
#  BANCO XYZ - SERVICIO DE DOMINIO (banco-core-api)
#  Unico componente con acceso directo a PostgreSQL.
#  Los tres BFF consumen este servicio, nunca la base.
# ============================================================
spring.application.name=banco-core-api
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bank_legacy_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Las tablas de negocio las crea el batch de la semana 3.
# Aqui solo se agrega operaciones_atm, por eso update y no create.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info

logging.level.com.bank.xyz.core=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %-30.30logger{0} : %msg%n
