# ============================================================
#  BANCO XYZ - MIGRACION DE PROCESOS LEGACY A SPRING BATCH
#  Semana 3 - Actividad sumativa
# ============================================================

spring.application.name=batch-migration

# ------------------------------------------------------------
#  BASE DE DATOS (PostgreSQL)
#  Las credenciales se leen de variables de entorno. Si no estan
#  definidas se usa el valor por defecto de desarrollo local.
# ------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bank_legacy_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# El pool debe soportar todos los hilos de particion a la vez,
# mas la conexion que usa el JobRepository.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=4

# ------------------------------------------------------------
#  JPA / HIBERNATE
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# ------------------------------------------------------------
#  SPRING BATCH
#  initialize-schema crea las tablas BATCH_* de metadatos.
#  job.enabled=false porque los jobs los lanza BatchRunner segun
#  los argumentos de linea de comandos, no todos al arrancar.
# ------------------------------------------------------------
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# ------------------------------------------------------------
#  PARAMETROS DEL BATCH (ver BatchProperties)
# ------------------------------------------------------------
# Tamano de chunk: 1000 filas / 4 particiones = 250 filas por hilo,
# con chunk 50 cada hilo hace 5 commits. Equilibra memoria y
# cantidad de transacciones.
banco.batch.chunk-size=50

# Estrategia de escalado: particionamiento local por rangos de linea.
banco.batch.particiones=4
banco.batch.hilos-core=4
banco.batch.hilos-max=8
banco.batch.cola=16

# Tolerancia a fallos
banco.batch.skip-limit=1000
banco.batch.retry-limit=3

# Ubicacion de los archivos oficiales de la evaluacion
banco.batch.ruta-datos=data/semana_3/

# Tasas de interes ANUAL por tipo de cuenta (en porcentaje)
banco.interes.ahorro=2.5
banco.interes.prestamo=12.0
banco.interes.hipoteca=8.0

# ------------------------------------------------------------
#  LOGGING
# ------------------------------------------------------------
logging.level.com.bank.xyz.batch=INFO
logging.level.org.springframework.batch=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%-18.18thread] %-5level %-38.38logger{0} : %msg%n
